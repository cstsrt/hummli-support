name: Hummli support
description: Report a problem or ask a question about Hummli
title: "[Support] "
labels: [support]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Hummli. This request will be public.
        **Never include a card number, barcode, card image, receipt or other personal information.**
  - type: dropdown
    id: topic
    attributes:
      label: What do you need help with?
      options:
        - Adding or importing a card
        - Barcode display or scanning
        - Logo or card appearance
        - Sorting or favourites
        - Privacy
        - Something else
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem without sharing any card or personal data.
    validations:
      required: true
  - type: input
    id: ios
    attributes:
      label: iOS version
      placeholder: e.g. iOS 26.0
  - type: input
    id: hummli
    attributes:
      label: Hummli version
      placeholder: e.g. 1.0
